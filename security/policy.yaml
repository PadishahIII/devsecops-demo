# =============================================================================
# Central gate policy — severity alone is not risk.
#
# Action precedence (highest wins):
#   1. exceptions (security/exceptions.yaml, exact fingerprint match, expiring)
#   2. fail_rule_classes   (exploitability class overrides, e.g. injection)
#   3. fail_tools          (categorical tools, e.g. secret leaks)
#   4. fail_when           (KEV / EPSS overrides)
#   5. severity_defaults   (baseline severity → action mapping)
#
# DAST findings (tool `zap`) are evaluated against the dedicated `dast:`
# section below instead of the general policy — see that section for why.
# =============================================================================

severity_defaults:
  critical: fail
  high: warn
  medium: pass
  low: pass
  informational: pass
  unknown: warn

# Exploitability classes: injection / deserialization / RCE rules are
# fail-by-class even when the vendor rates them "only" High — reachable
# injection is a blocking defect, not a warning.
fail_rule_classes:
  - "formatted-sql|sqli|sql-injection|sql_injection"
  - "ssrf"
  - "pickle|deseriali"
  - "arbitrary.code.execution|rce"

# Tool-level overrides: secrets are categorical — a leaked secret never passes,
# regardless of severity or exception.
fail_tools:
  - gitleaks

# KEV / EPSS: known-exploited or near-certain-exploitation findings behave
# like Criticals even at High severity (see design decision #1).
fail_when:
  - field: known_exploited
    value: true
    severities: [high, critical]
  - field: epss
    value: 0.9
    severities: [high]

exceptions:
  max_severity: high # critical findings can never be excepted
  file: security/exceptions.yaml

# License policy (fed from the CycloneDX SBOM — structural output, not prose).
licenses:
  fail: []
  warn: ["AGPL-3.0", "LGPL-3.0", "GPL-3.0"]

# ==============================================================
# DAST policy — findings from dynamic scanners (tool: zap) are
# evaluated against THIS section instead of the general policy.
#
# A finding on a live, externally-reachable endpoint is worse than
# the same rule in a static scan:
#   * high already FAILS by default (general policy only warns) —
#     blocks the promotion gate
#   * medium WARNS instead of passing — build marked unstable
#   * runtime-exploitable classes (SQLi / XSS / RCE / path
#     traversal / SSRF) fail outright regardless of vendor rating
#
# Precedence is identical to the general policy (severity < fail_when
# < fail_tools < classes < exceptions); only the baseline is stricter.
# ==============================================================
dast:
  severity_defaults:
    critical: fail
    high: fail
    medium: warn
    low: pass
    informational: pass
    unknown: warn
  fail_rule_classes: []
    # - "sql.*injection|sqli"
    # - "cross.site|xss"
    # - "remote.code.execution|rce|command.injection|os.command"
    # - "path.traversal"
    # - "ssrf|server.side.request.forgery"
  fail_tools: []
  # fail_when: []   # KEV/EPSS metadata only exists on static findings; leave empty
