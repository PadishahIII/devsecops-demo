# =============================================================================
# Admission: only signed+attested images from our pipeline may run.
# Enforced by Kyverno at deploy time — scanning proved the image is clean,
# THIS proves who built it (identity) and that it is unmodified (integrity).
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image
  annotations:
    policies.kyverno.io/title: Verify image signatures and SBOM attestations
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: require-signature-and-sbom-attestation
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces: ["kyverno", "kube-system"]
      verifyImages:
        - imageReferences:
            - "ghcr.io/PadishahIII/devsecops-demo:*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/PadishahIII/devsecops-demo/.github/workflows/*"
          attestations:
            - predicateType: https://cyclonedx.org/bom
              attestors:
                - entries:
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        subject: "https://github.com/PadishahIII/devsecops-demo/.github/workflows/*"
