apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notes-app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notes-app.labels" . | nindent 4 }}
    app.kubernetes.io/version: {{ .Values.appVersion }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ include "notes-app.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "notes-app.name" . }}
        environment: {{ .Values.environment }}
        app.kubernetes.io/version: {{ .Values.appVersion }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "notes-app.name" . }}
          # Digest-pinned by the pipeline (build once, promote the same digest).
          image: {{ include "notes-app.image" . }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.registry.dockerConfigJson }}
      imagePullSecrets:
        - name: {{ .Values.registry.secretName }}
      {{- end }}
