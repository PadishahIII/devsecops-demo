{{/*
Post-deployment smoke test, run as an in-cluster Job: health + CRUD + search
against the ClusterIP service (no port-forward needed). Rendered only when
smoke.enabled. The Job fails (and the pipeline with it) if any check fails;
`kubectl logs job/smoke-test` surfaces the failing step.
*/}}
{{- if .Values.smoke.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  namespace: {{ .Release.Namespace }}
  labels:
    app: smoke-test
    environment: {{ .Values.environment }}
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- if .Values.buildNumber }}
    app.kubernetes.io/pipeline: cd-{{ .Values.buildNumber }}
    {{- end }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        job-name: smoke-test
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # alpine `nobody` — the curl image ships no dedicated user
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          # pinned by digest
          image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "smoke: health"
              curl -fsS -m 10 http://{{ .Values.smoke.svcUrl }}/health >/dev/null
              echo "smoke: create note"
              curl -fsS -m 10 -X POST -d "title=smoke-$(date +%s)&content=ok" http://{{ .Values.smoke.svcUrl }}/notes >/dev/null
              echo "smoke: search"
              curl -fsS -m 10 "http://{{ .Values.smoke.svcUrl }}/search?q=smoke" | grep -q "smoke"
              echo "smoke tests passed"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
{{- end }}
