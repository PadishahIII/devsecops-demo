{{/*
Docker Hub pull secret. Rendered only when a dockerConfigJson is supplied
(sensitive — injected by the pipeline via a temp values file, never committed).
The deployment's imagePullSecrets reference is gated on the same value.
*/}}
{{- if .Values.registry.dockerConfigJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notes-app.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.registry.dockerConfigJson }}
{{- end }}
