{{/*
In-cluster ZAP baseline scan of the freshly deployed service. Rendered only when
dast.enabled (staging-only — the pipeline never enables it for production).

Design notes:
  * the scan script is invoked by relative name — the zaproxy image puts
    zap-baseline.py in /zap/ which is on PATH (Dockerfile-stable).
  * the container exits 0 even when ZAP reports findings: the scan's own verdict
    is captured to zap-exit.txt and the PIPELINE GATE decides. backoffLimit 0
    means we never silently retry a broken scan; a missing zap-report.json makes
    the pipeline fail closed.
  * REPORT RETRIEVAL: /zap/wrk is a hostPath dir INSIDE the kind node container
    (dast.reportsHostDir) — in kind, hostPath resolves in the node container's fs,
    not the physical host. kubectl cp is exec-based and CANNOT read from a
    completed pod (kubernetes#111045), so the report must survive container exit;
    the pipeline pulls it out of the node container with `docker cp` (agent and
    node share the host). The pipeline pre-creates the dir (mode 777) so the zap
    user (uid 1000) can write it.
  * default image user is `zap` (uid 1000); runAsUser matches it.
*/}}
{{- if .Values.dast.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: dast-scan
  namespace: {{ .Release.Namespace }}
  labels:
    app: dast-scan
    environment: {{ .Values.environment }}
    app.kubernetes.io/part-of: devsecops-demo
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- if .Values.buildNumber }}
    app.kubernetes.io/pipeline: cd-{{ .Values.buildNumber }}
    {{- end }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        job-name: dast-scan
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zap
          # pinned by digest (the :stable tag is a moving target)
          image: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              mkdir -p /zap/wrk
              zap-baseline.py -t {{ .Values.dast.url }} -l WARN \
                -J /zap/wrk/zap-report.json -r /zap/wrk/zap-report.html \
                || echo "zap exit=$? (gate decides)" | tee /zap/wrk/zap-exit.txt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: wrk
              mountPath: /zap/wrk
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: wrk
          hostPath:
            path: {{ .Values.dast.reportsHostDir }}
            type: DirectoryOrCreate
{{- end }}
