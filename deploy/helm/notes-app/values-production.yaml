# Production overrides. DAST is deliberately NOT run against production
# (aggressive active scans on a live prod service); the hotfix path is gated on
# static findings + post-deployment verification instead. The smoke test still
# runs (benign in-cluster checks).
# The namespace is set by the pipeline's `helm -n demo-production` flag.
# Single replica: the app keeps its notes in a per-pod SQLite file, so a
# multi-replica rollout would serve inconsistent data across pods (and the
# smoke Job's create→search would hit different pods). Scale out needs a
# shared DB backend, not more replicas.
environment: production
replicas: 1
