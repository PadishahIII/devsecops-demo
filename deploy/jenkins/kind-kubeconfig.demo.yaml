# =============================================================================
# Demo kubeconfig for the LOCAL kind cluster (localhost only).
#
# Use this as the `kind-kubeconfig` FILE credential in Jenkins (see
# Jenkinsfile.cd header) or point KUBECONFIG at it:
#
#   export KUBECONFIG=deploy/jenkins/kind-kubeconfig.demo.yaml
#   kubectl cluster-info
#
# Regenerate on another machine (or after `kind delete cluster` + recreate,
# the port may change):
#
#   kind get kubeconfig --name kind > deploy/jenkins/kind-kubeconfig.demo.yaml
#
# Security note: the client cert/key below are only valid for 127.0.0.1 on
# the machine that created the cluster — safe to commit for a demo, but do
# NOT reuse this pattern for a reachable/production cluster.
# =============================================================================
apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://127.0.0.1:52872
  name: kind-kind
contexts:
- context:
    cluster: kind-kind
    user: kind-kind
  name: kind-kind
current-context: kind-kind
kind: Config
users:
- name: kind-kind
  user:
    client-certificate-data: 
    client-key-data: 

