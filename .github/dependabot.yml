# Dependency hygiene: keep CI actions and Python deps pinned + current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
